# SonarCloud configuration.
#
# Analysis runs via SonarCloud's Automatic Analysis (the SonarCloud GitHub App scans the repo
# directly — there is no CI scanner step in this repo). The project key and organization are
# auto-bound from the GitHub integration, so only analysis-scope settings live here.
#
# Coverage is intentionally not reported here: Automatic Analysis cannot run JaCoCo, so
# "Coverage on New Code" reads 0% until a JaCoCo-fed CI scanner is wired up (tracked in #124).

sonar.sourceEncoding=UTF-8

# Exclude generated code and the non-library modules (runnable examples, benchmark harness) from
# analysis — they are not part of the framework's maintained surface and would otherwise skew the
# issue and duplication counts.
sonar.exclusions=\
  **/generated-sources/**,\
  **/io/tiko/generated/**,\
  tiko-examples/**,\
  comparisons/**
