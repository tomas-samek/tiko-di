# Defaults baked into tiko-kafka.jar. User application.yaml entries override these
# per-key; values not overridden fall through to @Default annotations on KafkaConfig.
# Nested form matches what users naturally write — both the user file and this one
# must use the same shape so the layered deep-merge actually unifies them.
tiko:
  kafka:
    bootstrap-servers: "localhost:9092"
    consumer-group: "tiko-app"
    serializer: json
    auto-offset-reset: earliest
    poll-timeout: PT0.5S
    shutdown-timeout: PT5S
    producer-properties: {}
    consumer-properties: {}
    # SEEK (default): retry a failed record forever (no data loss, but a poison
    # record blocks its partition). SKIP: log via the ErrorHandler and commit past
    # it (opt-in; also drops records that failed for a transient reason). See #313.
    poison-record-policy: SEEK
