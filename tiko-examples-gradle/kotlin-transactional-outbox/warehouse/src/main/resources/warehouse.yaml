outbox:
  dbUrl: ${WAREHOUSE_DB_URL:jdbc:h2:file:./build/outbox-data/warehouse;WRITE_DELAY=0;DB_CLOSE_DELAY=-1}
  kafkaBootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
tiko:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer-group: kotlin-outbox-warehouse
    auto-offset-reset: earliest
