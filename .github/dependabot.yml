# Keeps the SHA-pinned actions in .github/workflows/ current (SEC-10, #477). Dependabot
# rewrites both the commit SHA and the trailing "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
