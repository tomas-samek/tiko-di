# Fails a PR that adds or upgrades to a dependency with a known high/critical vulnerability
# (GitHub Advisory Database). Like Dependabot alerts, it sees only dependencies declared in the poms,
# not modules shaded in transitively (e.g. jackson-core inside tiko-kafka).
name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
