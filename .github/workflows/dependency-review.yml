# Fails a PR that adds or upgrades to a dependency with a known high/critical vulnerability
# (GitHub Advisory Database). Like Dependabot alerts, it sees only dependencies declared in the poms,
# not modules shaded in transitively (e.g. jackson-core inside tiko-kafka).
name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
