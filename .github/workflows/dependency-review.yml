# Fails a PR that adds or upgrades to a dependency with a known high/critical vulnerability
# (GitHub Advisory Database). Like Dependabot alerts, it sees only dependencies declared in the poms,
# not modules shaded in transitively (e.g. jackson-core inside tiko-kafka).
name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
