# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25', '26' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  integration-test:
    name: Integration Tests (JDK ${{ matrix.java }}, Docker / Testcontainers)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '26' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      # Two-step: install all reactor jars first (no tests, no integTest profile),
      # then run the IT against the populated local repo. tiko-kafka's integTest
      # profile references tiko-kafka-processor on its annotation processor path,
      # but the processor builds AFTER tiko-kafka in the reactor — so the jar
      # must already be in ~/.m2 by the time tiko-kafka's testCompile runs.
      - name: Install reactor artifacts
        run: mvn -B -DskipTests install --file pom.xml
      - name: Run integration tests
        run: mvn -B verify -P integTest --file pom.xml
