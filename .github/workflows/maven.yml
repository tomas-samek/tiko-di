# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # JDK support policy: every LTS from 21 onward plus every GA since the latest LTS.
        # README Java badge and site/index.html list the same set (SiteInSyncTest enforces it).
        java: [ '21', '25', '26', '27' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  integration-test:
    name: Integration Tests (JDK ${{ matrix.java }}, Docker / Testcontainers)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Not governed by the JDK support policy. The newest JDK is in so the archetype IT runs
        # archetype:generate end to end on it (#557).
        java: [ '21', '26', '27' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute new-code/blame accurately.
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      # `install` (not `verify`) so the archetype IT — which spawns a sub-Maven
      # build that resolves `io.tiko:tiko-bom` from the local repo — sees the
      # parent BOM. With `verify` only, nothing is installed and the archetype IT
      # fails to find tiko-bom in central.
      - name: Run integration tests
        run: mvn -B install --file pom.xml
      # Docker is reachable on these runners, so a skipped integration test means a broken setup,
      # not a missing Docker. A Testcontainers IT that couldn't reach Docker went green here for
      # weeks (#561).
      - name: Fail on skipped integration tests
        run: |
          skipped=$(find . -path '*/target/failsafe-reports/TEST-*.xml' -exec grep -lE '<testsuite [^>]*skipped="[1-9]' {} + || true)
          if [ -n "$skipped" ]; then
            echo "::error::Integration tests were skipped on a runner with Docker:"
            echo "$skipped"
            exit 1
          fi
      # SonarCloud CI-based analysis, on the JDK 21 leg only (one analysis per build). Runs after
      # `install`, reusing the compiled classes + the JaCoCo aggregate from this same job — no
      # rebuild. Requires the SONAR_TOKEN secret and Automatic Analysis DISABLED in the SonarCloud
      # UI (the two analysis modes are mutually exclusive). Project key, org, host, coverage path,
      # and exclusions all come from the root pom's <properties>.
      #
      # Invoked by full groupId:artifactId:goal, not the `sonar:sonar` prefix. Prefix resolution
      # only searches the pluginGroups (org.apache.maven.plugins, org.codehaus.mojo) plus plugins
      # declared in <build><plugins>; this plugin lives in <pluginManagement>, so the prefix is not
      # resolvable and the step fails with "No plugin found for prefix 'sonar'". The version is
      # deliberately omitted — <pluginManagement> pins it (${sonar-maven-plugin.version}), keeping
      # the root pom the single source of truth.
      - name: SonarCloud scan
        if: matrix.java == '21'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file pom.xml
      # `install` runs the verify phase, so JaCoCo's per-module `report` and the aggregate
      # `report-aggregate` have produced their XML by now. Upload them so coverage tooling
      # (e.g. a future SonarCloud CI scanner) can consume them without re-running the build.
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco/jacoco.xml
            tiko-coverage/target/site/jacoco-aggregate/jacoco.xml
          if-no-files-found: warn

  # Kotlin on KSP, end to end: a separate Gradle build (not a Maven module) that consumes the
  # reactor's artifacts from mavenLocal. A non-zero exit from `build` (incl. the test) or `run`
  # (the example exits 1 if the expected event chain did not arrive) fails the job.
  kotlin-gradle:
    name: Kotlin + KSP example (Gradle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install Tiko artifacts to the local Maven repository
        run: mvn -B install -DskipTests --file pom.xml
      - name: Build, test and run the Gradle example
        working-directory: tiko-examples-gradle/kotlin-quickstart
        # The wrapper retries its own distribution download (gradle-wrapper.properties); plugins are
        # resolved from the portal on this first invocation, so bound-retry it against transient
        # download failures before failing the job.
        run: |
          for attempt in 1 2 3; do
            ./gradlew build run && exit 0
            echo "gradle attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      - name: Incremental KSP rebuild adds and changes components
        working-directory: tiko-examples-gradle/kotlin-quickstart
        run: ci/incremental-check.sh
      # `--smoke` opens and lists a ticket over real HTTP, then exits non-zero on failure.
      - name: Build, test and smoke-run the Ktor + Exposed example
        working-directory: tiko-examples-gradle/kotlin-ktor-exposed
        run: |
          for attempt in 1 2 3; do
            ./gradlew build run --args=--smoke && exit 0
            echo "gradle attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      # `run` needs a broker; the build's test runs the flow on the in-memory FakeKafkaBroker.
      - name: Build and test the Kafka consumer example
        working-directory: tiko-examples-gradle/kotlin-kafka-consumer
        run: |
          for attempt in 1 2 3; do
            ./gradlew build && exit 0
            echo "gradle attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
      - name: Verify transactional outbox crash recovery in Kotlin
        working-directory: tiko-examples-gradle/kotlin-transactional-outbox
        run: |
          for attempt in 1 2 3; do
            ./gradlew :e2e:test -PrequireDocker && exit 0
            echo "gradle attempt $attempt failed" >&2
            sleep 15
          done
          exit 1
