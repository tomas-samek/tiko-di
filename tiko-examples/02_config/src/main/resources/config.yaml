# Tiko DI configuration injection example.
# Defaults shown for env vars to keep the example runnable without setting them.
db:
  url: ${DB_URL:jdbc:postgres://localhost:5432/example}
  maxConnections: 20
  connectTimeout: PT5S

app:
  name: example-service
  logLevel: ${LOG_LEVEL:INFO}
  server:
    host: 0.0.0.0
    # port omitted on purpose to demonstrate @Default("8080") on a nested-record field
