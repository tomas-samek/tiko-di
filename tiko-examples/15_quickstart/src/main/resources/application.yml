# Quickstart configuration — typed binding via @Configuration AppConfig.
# H2 in-memory by default so the example runs without external infrastructure.
# Override via env vars for a real database.
app:
  server:
    port: ${SERVER_PORT:8080}
  db:
    url: ${DB_URL:jdbc:h2:mem:quickstart;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    user: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    poolSize: 4
